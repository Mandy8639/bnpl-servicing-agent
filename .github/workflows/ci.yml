name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest
      - name: README numbers match committed reports
        run: python -m evals.readme --check
      - name: Golden-set evals in stub mode ($0, gate must pass)
        run: |
          python -m evals.run_evals --mode stub
          python -m evals.run_evals --set heldout --mode stub
          python -m evals.run_merchant_evals --mode stub
